name: gruhasankalp_mobile
description: "GruhaSankalp Sovereign Real Estate & Cadastral Legal Clearinghouse Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking & REST
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Data Modeling & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # UI & Styling
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
